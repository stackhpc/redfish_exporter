name: PR

on:
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.20'

    - name: Check style
      run: make style

    - name: Check that we can compile the exporter
      run: make build

    - name: Check that we can build the docker container
      run: make docker-build
