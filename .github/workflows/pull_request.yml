name: PR

on:
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.27'

    - name: Check style
      run: make style

    - name: Run tests
      run: go test ./...
      env:
        FIXTURES_DIR: "${{ github.workspace }}/test_dependencies"

    - name: Build Docker container
      run: make docker-build
